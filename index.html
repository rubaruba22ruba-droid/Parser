<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Защита: строгая CSP (только свои файлы, никаких inline-скриптов и сторонних доменов). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>NFT Tracker — трекер NFT-подарков Telegram</title>
  <meta name="description" content="Telegram-боты для отслеживания лотов NFT-подарков ниже рынка: премиум трекер, бесплатный трекер и поддержка.">
  <meta name="theme-color" content="#07080f">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://rubaruba22ruba-droid.github.io/Parser/">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="NFT Tracker">
  <meta property="og:title" content="NFT Tracker — лови NFT-подарки ниже рынка">
  <meta property="og:description" content="Премиум и бесплатный трекеры лотов NFT-подарков в Telegram.">
  <meta property="og:url" content="https://rubaruba22ruba-droid.github.io/Parser/">
  <meta property="og:image" content="https://rubaruba22ruba-droid.github.io/Parser/assets/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://rubaruba22ruba-droid.github.io/Parser/assets/img/og.jpg">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="preload" href="assets/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="data/site.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <noscript><link rel="stylesheet" href="assets/css/nojs.css"></noscript>

  <script defer src="assets/js/vendor.js"></script>
  <script defer src="assets/js/app.js"></script>
</head>
<body>

  <!-- Иконки (спрайт). Не display:none — иначе градиенты не работают в Safari. -->
  <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffd37a"/>
        <stop offset=".55" stop-color="#ff7ab8"/>
        <stop offset="1" stop-color="#8b7cf7"/>
      </linearGradient>
      <linearGradient id="g-area" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff7ab8" stop-opacity=".32"/>
        <stop offset="1" stop-color="#ff7ab8" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="g-gem" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7ee8ff"/>
        <stop offset=".5" stop-color="#8b7cf7"/>
        <stop offset="1" stop-color="#ff7ab8"/>
      </linearGradient>
    </defs>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.7 5.9 6.4.7-4.8 4.3 1.4 6.3L12 16.7 6.3 20l1.4-6.3L2.9 9.4l6.4-.7z" fill="currentColor"/></symbol>
    <symbol id="i-tg" viewBox="0 0 24 24"><path d="M21.6 3.4L2.9 10.6c-1 .4-1 1.2-.2 1.4l4.7 1.5 1.8 5.5c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.2-2.1 4.6 3.4c.8.5 1.5.2 1.7-.8l3-14.3c.3-1.2-.4-1.7-1.3-1.3zM9.1 13.3l8.7-5.5c.4-.3.8-.1.5.2l-7.2 6.5-.3 3.1-1.7-4.3z" fill="currentColor"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5.5h16a1 1 0 011 1V16a1 1 0 01-1 1h-8l-4.5 3.5V17H4a1 1 0 01-1-1V6.5a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7.5 10h9M7.5 13h5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-gem" viewBox="0 0 64 64"><path d="M32 8l20 18-20 30L12 26z" fill="url(#g-gem)"/><path d="M12 26h40M32 8l-8 18 8 30 8-30z" fill="none" stroke="#07080f" stroke-opacity=".35" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="bg" aria-hidden="true">
    <i class="orb orb--a"></i><i class="orb orb--b"></i><i class="orb orb--c"></i>
    <i class="grid"></i>
    <i class="glow"></i>
  </div>

  <!-- Экран загрузки: исчезает сразу после отрисовки контента. -->
  <div class="boot" id="boot" aria-hidden="true"><span class="boot__ring"></span></div>

  <header class="top" id="top"></header>

  <main id="main">
    <section class="hero" id="hero" aria-labelledby="hero-title"></section>
    <section class="trackers" id="trackers" aria-labelledby="trackers-title"></section>
    <section class="steps" id="steps" aria-labelledby="steps-title"></section>
    <section class="support" id="support" aria-labelledby="support-title"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <!-- Запаска на случай сбоя загрузки данных (или выключенного JS). Здесь нет ни ссылок, ни данных:
       вся информация лежит в data/site.json. Показывается только при сбое. -->
  <section class="fallback" id="fallback">
    <h1>NFT Tracker</h1>
    <p>Не удалось загрузить страницу. Проверьте соединение и включённый JavaScript, затем обновите её.</p>
    <p><a class="btn btn--ghost" href="./">Обновить страницу</a></p>
  </section>

</body>
</html>
